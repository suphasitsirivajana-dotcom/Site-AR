<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SiteAR</title>
  <meta name="description" content="SiteAR — BIM site markup in AR. IFC / DXF / GLB, GPS + QR positioning, BCF export for Revit and openBIM.">
  <meta name="theme-color" content="#0a0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SiteAR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/web-ifc-api.js",
      "dxf-parser": "https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/+esm",
      "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm",
      "jsqr": "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/+esm",
      "qrcode-generator": "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div id="brand"></div>
      <div class="tb-sep"></div>
      <button id="project-name" class="tb-project" title="Rename project">Project</button>
      <div id="save-state" class="save-state"></div>
      <div class="tb-spacer"></div>
      <button id="btn-panel" class="icon-btn" title="Panel" aria-label="Toggle panel">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M14.5 4v16"/></svg>
        <span class="count" id="mk-count">0</span>
      </button>
    </header>

    <nav id="ribbon-tabs" role="tablist"></nav>
    <div id="ribbon"></div>

    <main id="workspace">
      <div id="viewport">
        <video id="camfeed" playsinline muted hidden></video>
        <canvas id="c"></canvas>

        <div id="hint" hidden></div>
        <div id="lock-badge" class="lock-badge" hidden>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <span>View locked</span>
        </div>

        <button id="compass" class="compass" title="North · click to fit">
          <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" class="c-ring"/>
            <g id="compass-needle"><path d="M24 7 29 24H19z" class="c-n"/><path d="M24 41 19 24h10z" class="c-s"/><text x="24" y="5.2" text-anchor="middle" class="c-t">N</text></g></svg>
        </button>

        <button id="home-btn" class="home-btn" title="Home (H) · right-click = Set Home" aria-label="Home view">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5M10 20v-5.5h4V20"/></svg>
        </button>
        <div id="clip-ctl" class="clip-ctl" hidden></div>

        <div id="modebar" class="modebar">
          <button data-mode="orbit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6M12 12v9.2"/></svg><span>3D</span></button>
          <button data-mode="plan"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 11h7V3.5M14 20.5V14h6.5"/></svg><span>Plan</span></button>
          <button data-mode="walk"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2.2-6.5L14 17v4M8 11.5l3-3.5 3.5.8 1.8 3.7 2.2 1M11.2 14.5l-.5-4"/></svg><span>Walk</span></button>
          <button data-mode="ar" class="ar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8V6A2.5 2.5 0 0 1 6 3.5h2M16 3.5h2A2.5 2.5 0 0 1 20.5 6v2M20.5 16v2a2.5 2.5 0 0 1-2.5 2.5h-2M8 20.5H6A2.5 2.5 0 0 1 3.5 18v-2"/><path d="M12 7.5l4 2.3v4.4L12 16.5l-4-2.3V9.8zM8 9.8l4 2.3 4-2.3M12 12.1v4.4"/></svg><span>AR</span></button>
        </div>

        <div id="selchip" class="selchip" hidden></div>
        <div id="joystick" class="joystick" hidden><div class="knob"></div></div>
        <div id="crosshair" class="crosshair" hidden><span></span></div>

        <div id="empty" class="empty">
          <div class="empty-card">
            <div class="empty-orb"></div>
            <h1>Bring your BIM <span>on site.</span></h1>
            <p>เปิดโมเดล IFC จาก Revit, แบบ DXF หรือ GLB · ระบุตำแหน่งด้วย GPS / QR · มาร์ค คอมเมนต์ โน้ต ใน 3D, แปลน, Walk หรือ AR · ส่งกลับ Revit ด้วย BCF</p>
            <div class="empty-actions">
              <button class="btn primary lg" data-e="open"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg><span>Open model</span></button>
              <button class="btn lg" data-e="sample"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6M4 20h16"/></svg><span>Try sample</span></button>
              <button class="btn ghost lg" data-e="import"><span>Import project</span></button>
            </div>
            <div class="formats"><span>IFC 2x3 / 4</span><span>DXF</span><span>GLB · GLTF</span><span>OBJ</span><span>BCF 3.0</span></div>
            <p class="drop-hint">หรือลากไฟล์มาวางที่นี่</p>
          </div>
        </div>
        <div id="busy" class="busy" hidden><div class="spinner"></div><span>Loading…</span></div>
        <div class="drop-overlay"><div>Drop IFC · DXF · GLB · BCF</div></div>

        <div id="ar-overlay" class="ar-overlay" hidden></div>
      </div>

      <aside id="panel">
        <div class="panel-grip"></div>
        <div class="panel-head">
          <div id="panel-tabs" class="seg">
            <button data-tab="markups">Markups</button><button data-tab="views">Views</button><button data-tab="info">Info</button>
          </div>
          <button id="panel-close" class="icon-btn" aria-label="Close panel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="panel-body"></div>
      </aside>
    </main>

    <footer id="statusbar">
      <span class="st-item mono" id="st-xyz">—</span>
      <span class="st-spacer"></span>
      <span class="st-item" id="st-anchor"></span>
      <span class="st-item" id="st-gps"></span>
      <span class="st-item muted hide-sm">IFC · m · Z-up</span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <!-- no accept filter on purpose: iOS greys out unknown extensions like .ifc. The app checks the extension itself. -->
  <input type="file" id="file-model" multiple hidden>
  <input type="file" id="file-project" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
